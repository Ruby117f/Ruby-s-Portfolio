 links.forEach((a,i)=>{

let armed=false,amount=0,stamp=0,leaving=false;const hint=document.querySelector('#hint');function atBottom(){return innerHeight+scrollY>=document.documentElement.scrollHeight-4}window.addEventListener('scroll',()=>{if(!atBottom()){armed=false;amount=0;hint.textContent='滑到底部后，继续向下滚动进入下一站'}});function advance(delta){if(delta<=0||!atBottom()||leaving)return;const now=Date.now();if(!armed){armed=true;stamp=now;amount=0;hint.textContent='继续向下滚动，进入下一站';return}if(now-stamp<650)return;amount+=Math.min(delta,90);document.querySelector('.progress').style.width=Math.min(150,amount/240*150)+'px';if(amount>240){leaving=true;location.href=document.querySelector('.next-circle').href}}window.addEventListener('wheel',e=>advance(e.deltaY),{passive:true});let touchY=0;window.addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});window.addEventListener('touchend',e=>advance((touchY-e.changedTouches[0].clientY)*3),{passive:true});window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key))advance(90)});const initialActive=document.querySelector('.toc a.active');if(initialActive)centerActive(initialActive);const topNav=document.querySelector('nav');function updateNavGlass(){topNav.classList.toggle('scrolled',scrollY>12)}window.addEventListener('scroll',updateNavGlass,{passive:true});updateNavGlass();const slowObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('entered');slowObserver.unobserve(e.target)}})},{threshold:.08});document.querySelectorAll('.toc a').forEach((el,i)=>{el.classList.add('slow-enter');el.style.setProperty('--enter-delay',Math.min(i*100,700)+'ms');slowObserver.observe(el)});</script><script src="assets/custom-cursor.js?v=71db97272607" defer></script><script src="assets/project-transition.js?v=fe8b3c731a6c"></script></body></html>
